name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the page parses and the layout is intact
        run: |
          node -e "
            const fs=require('fs');
            const html=fs.readFileSync('public/index.html','utf8');
            const js=html.slice(html.indexOf('<script>')+8, html.lastIndexOf('</script>'));
            fs.writeFileSync('/tmp/app.js', js);
            const body=html.slice(html.indexOf('<div id=\"app\">'), html.indexOf('<script>'));
            const o=(body.match(/<div\b/g)||[]).length, c=(body.match(/<\/div>/g)||[]).length;
            if (o!==c) { console.error('unbalanced divs: '+o+' open, '+c+' close'); process.exit(1); }
            if (html.indexOf('\u2014')!==-1) { console.error('em dash found'); process.exit(1); }
            console.log('divs balanced at '+o+', no em dashes');
          "
          node --check /tmp/app.js

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
